    <main>
      <h2 class="titre-ateliers">Rejoignez-nous !</h2>
  <p class="ateliers-description">Remplissez ce formulaire pour nous faire part de votre intérêt et poser vos questions.</p>
  
  <dialog open class="form-simulation">
 <form method="dialog">
    <fieldset class="first-field">
      <legend>Informations personnelles</legend>
      
      <label>Nom complet *
        <input type="text" 
        required 
        name="nom"
        placeholder="votre nom complet">
      </label>

      <label>
        E-mail *
        <input type="email" 
        required 
        name="email"
        placeholder="exemple@uiz.ac.ma">
      </label>

      <label>
        Téléphone
        <input type="tel" 
        placeholder="06 12 00 00 00"
        name="telephone">
      </label>
      </fieldset>

<fieldset class="second-field">
  <legend>Détails de la participation</legend>
 <label>
       Date souhaitée
       <input type="date"
        name="date">
 </label>

      <label>Filière
      <select name="filiere">
       <option value="" selected disabled>sélectionner votre filière</option>
        <option>Licence Ingénierie logicielle</option>
        <option>Analytique des Données et Intelligence Artificielle </option>
        <option>Ingénierie Informatique et Systèmes Embarqués</option>
      </select>
      </label>

       <label>Atelier préféré
      <select name="atelier">
        <option value="" selected disabled>sélectionner votre atelier préféré</option>
        <option>Assistant pédagogique</option>
        <option>Qualité du code</option>
        <option>Prototypage d&#8217;application</option>
      </select>
      </label>

    <div> Niveau
        <label>
        <input type="radio"
         name="niveau" 
        value="debutant"
         checked>
      Débutant
      </label>
      <label>
        <input type="radio" 
        value="intermediaire"
        name="niveau">
        Intermédiaire
      </label>
    </div>

      <div> Centres d'intérêt
        <label>
        <input type="checkbox"
        name="interets"
        value="ia">
      IA
      </label>
      <label>
        <input 
        type="checkbox" 
        name="interets"
        value="web">
        Web
      </label>
       <label>
        <input 
        type="checkbox" 
        name="interets"
        value="donnees">
        Données
      </label>
      </div>
    </fieldset>

<fieldset class="third-field">
  <legend>Message</legend>
  <label>
  Votre message
  <textarea placeholder="votre message ici..." name="message"></textarea>
  </label>
</fieldset>

    <div class="form-buttons">
  <button type="submit">Envoyer</button>
  <button type="reset">Effacer</button>
</div>
  </form>
  </dialog>
